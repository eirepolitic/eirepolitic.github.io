openapi: 3.1.0
info:
  title: GitHub GPT Wrapper
  version: 0.2.0
  description: >
    Wrapper API for a custom GPT to read files, browse repos, preview and apply file changes on branches,
    manage pull requests, inspect workflow runs, and manage repository variables and secrets for a single GitHub owner.

servers:
  - url: https://PRIVATE-LAMBDA-URL-REDACTED.invalid

security:
  - ApiKeyAuth: []

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  schemas:
    UpsertRequest:
      type: object
      required: [path, content, commit_message]
      properties:
        path:
          type: string
        content:
          type: string
        commit_message:
          type: string
        base_branch:
          type: string
        branch_name:
          type: string

    DeleteRequest:
      type: object
      required: [path, commit_message]
      properties:
        path:
          type: string
        commit_message:
          type: string
        base_branch:
          type: string
        branch_name:
          type: string

    PullRequestCreateRequest:
      type: object
      required: [title, head_branch]
      properties:
        title:
          type: string
        body:
          type: string
        head_branch:
          type: string
        base_branch:
          type: string
        draft:
          type: boolean
          default: true

    PullRequestMergeRequest:
      type: object
      properties:
        commit_title:
          type: string
        commit_message:
          type: string
        merge_method:
          type: string
          enum: [merge, squash, rebase]
          default: merge
        sha:
          type: string

    PullRequestUpdateRequest:
      type: object
      properties:
        title:
          type: string
        body:
          type: string
        base_branch:
          type: string
        state:
          type: string
          enum: [open, closed]

    PullRequestCloseRequest:
      type: object
      properties:
        state_reason:
          type: string
          enum: [completed, not_planned, reopened]
          default: completed

    BranchCreateRequest:
      type: object
      required: [new_branch]
      properties:
        new_branch:
          type: string
        from_branch:
          type: string

    DispatchWorkflowRequest:
      type: object
      required: [ref]
      properties:
        ref:
          type: string
        inputs:
          type: object
          additionalProperties: true

    VariableSetRequest:
      type: object
      required: [value]
      properties:
        value:
          type: string

    SecretSetRequest:
      type: object
      required: [plaintext_value]
      properties:
        plaintext_value:
          type: string

paths:
  /repos/{repo}/files:
    get:
      operationId: getFile
      summary: Get a file from a repository
      parameters:
        - name: repo
          in: path
          required: true
          schema:
            type: string
        - name: path
          in: query
          required: true
          schema:
            type: string
        - name: ref
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: File contents

  /repos/{repo}/tree:
    get:
      operationId: listRepoTree
      summary: List repository tree contents for a ref
      parameters:
        - name: repo
          in: path
          required: true
          schema:
            type: string
        - name: ref
          in: query
          required: false
          schema:
            type: string
        - name: recursive
          in: query
          required: false
          schema:
            type: boolean
            default: true
        - name: path_prefix
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Repository tree listing

  /repos/{repo}/search:
    get:
      operationId: searchRepoContents
      summary: Search code contents inside a repository
      parameters:
        - name: repo
          in: path
          required: true
          schema:
            type: string
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            default: 25
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Search results

  /repos/{repo}/files/preview-upsert:
    post:
      operationId: previewUpsertFile
      summary: Preview a file create or update without writing to GitHub
      description: Use this first, show the diff to the user, then ask for approval before apply-upsert.
      parameters:
        - name: repo
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertRequest'
      responses:
        '200':
          description: Preview diff

  /repos/{repo}/files/apply-upsert:
    post:
      operationId: applyUpsertFile
      summary: Create or update a file on a branch
      description: Writes the file to a branch. Use preview-upsert first.
      parameters:
        - name: repo
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertRequest'
      responses:
        '200':
          description: File written to branch

  /repos/{repo}/files/preview-delete:
    post:
      operationId: previewDeleteFile
      summary: Preview a file deletion without writing to GitHub
      description: Use this first, show the diff to the user, then ask for approval before apply-delete.
      parameters:
        - name: repo
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteRequest'
      responses:
        '200':
          description: Preview delete diff

  /repos/{repo}/files/apply-delete:
    post:
      operationId: applyDeleteFile
      summary: Delete a file on a branch
      description: Deletes the file from a branch. Use preview-delete first.
      parameters:
        - name: repo
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteRequest'
      responses:
        '200':
          description: File deleted on branch

  /repos/{repo}/branches:
    get:
      operationId: listBranches
      summary: List repository branches
      parameters:
        - name: repo
          in: path
          required: true
          schema:
            type: string
        - name: protected
          in: query
          required: false
          schema:
            type: boolean
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            default: 100
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Branch list

    post:
      operationId: createBranch
      summary: Create a repository branch
      parameters:
        - name: repo
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchCreateRequest'
      responses:
        '200':
          description: Branch created

  /repos/{repo}/branches/{branch_name}:
    delete:
      operationId: deleteBranch
      summary: Delete a repository branch
      parameters:
        - name: repo
          in: path
          required: true
          schema:
            type: string
        - name: branch_name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Branch deleted

  /repos/{repo}/pull-requests:
    get:
      operationId: listPullRequests
      summary: List pull requests
      parameters:
        - name: repo
          in: path
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
            default: open
        - name: head
          in: query
          required: false
          schema:
            type: string
        - name: base
          in: query
          required: false
          schema:
            type: string
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            default: 30
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Pull request list

    post:
      operationId: createPullRequest
      summary: Open a pull request from a branch to the base branch
      parameters:
        - name: repo
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PullRequestCreateRequest'
      responses:
        '200':
          description: Pull request created

  /repos/{repo}/pull-requests/{number}:
    get:
      operationId: getPullRequest
      summary: Get a pull request
      parameters:
        - name: repo
          in: path
          required: true
          schema:
            type: string
        - name: number
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Pull request details

    patch:
      operationId: updatePullRequest
      summary: Update a pull request
      parameters:
        - name: repo
          in: path
          required: true
          schema:
            type: string
        - name: number
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PullRequestUpdateRequest'
      responses:
        '200':
          description: Pull request updated

  /repos/{repo}/pull-requests/{number}/close:
    post:
      operationId: closePullRequest
      summary: Close a pull request
      parameters:
        - name: repo
          in: path
          required: true
          schema:
            type: string
        - name: number
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PullRequestCloseRequest'
      responses:
        '200':
          description: Pull request closed

  /repos/{repo}/pull-requests/{number}/merge:
    post:
      operationId: mergePullRequest
      summary: Merge a pull request
      parameters:
        - name: repo
          in: path
          required: true
          schema:
            type: string
        - name: number
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PullRequestMergeRequest'
      responses:
        '200':
          description: Pull request merge result

  /repos/{repo}/workflows:
    get:
      operationId: listWorkflows
      summary: List repository workflows
      parameters:
        - name: repo
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Workflow list

  /repos/{repo}/workflows/{workflow_id}/runs:
    get:
      operationId: listWorkflowRuns
      summary: List workflow runs for a workflow
      parameters:
        - name: repo
          in: path
          required: true
          schema:
            type: string
        - name: workflow_id
          in: path
          required: true
          schema:
            type: string
        - name: branch
          in: query
          required: false
          schema:
            type: string
        - name: event
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Workflow run list

  /repos/{repo}/workflow-runs/{run_id}:
    get:
      operationId: getWorkflowRun
      summary: Get workflow run details
      parameters:
        - name: repo
          in: path
          required: true
          schema:
            type: string
        - name: run_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Workflow run details

  /repos/{repo}/workflow-runs/{run_id}/jobs:
    get:
      operationId: listWorkflowRunJobs
      summary: List jobs for a workflow run
      parameters:
        - name: repo
          in: path
          required: true
          schema:
            type: string
        - name: run_id
          in: path
          required: true
          schema:
            type: integer
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            default: 100
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Workflow run jobs

  /repos/{repo}/workflow-runs/{run_id}/logs:
    get:
      operationId: getWorkflowRunLogs
      summary: Get a download URL for workflow run logs
      parameters:
        - name: repo
          in: path
          required: true
          schema:
            type: string
        - name: run_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Workflow run log download URL

  /repos/{repo}/workflow-runs/{run_id}/artifacts:
    get:
      operationId: listWorkflowRunArtifacts
      summary: List artifacts for a workflow run
      parameters:
        - name: repo
          in: path
          required: true
          schema:
            type: string
        - name: run_id
          in: path
          required: true
          schema:
            type: integer
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            default: 100
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Workflow run artifacts

  /repos/{repo}/artifacts/{artifact_id}:
    get:
      operationId: getArtifactMetadata
      summary: Get artifact metadata
      parameters:
        - name: repo
          in: path
          required: true
          schema:
            type: string
        - name: artifact_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Artifact metadata

  /repos/{repo}/workflows/{workflow_id}/dispatch:
    post:
      operationId: dispatchWorkflow
      summary: Dispatch a workflow that supports workflow_dispatch
      parameters:
        - name: repo
          in: path
          required: true
          schema:
            type: string
        - name: workflow_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DispatchWorkflowRequest'
      responses:
        '200':
          description: Workflow dispatched

  /repos/{repo}/workflows/{workflow_id}/enable:
    post:
      operationId: enableWorkflow
      summary: Enable a workflow
      parameters:
        - name: repo
          in: path
          required: true
          schema:
            type: string
        - name: workflow_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Workflow enabled

  /repos/{repo}/workflows/{workflow_id}/disable:
    post:
      operationId: disableWorkflow
      summary: Disable a workflow
      parameters:
        - name: repo
          in: path
          required: true
          schema:
            type: string
        - name: workflow_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Workflow disabled

  /repos/{repo}/variables/{name}:
    put:
      operationId: setVariable
      summary: Create or update a repository Actions variable
      parameters:
        - name: repo
          in: path
          required: true
          schema:
            type: string
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VariableSetRequest'
      responses:
        '200':
          description: Variable set

    delete:
      operationId: deleteVariable
      summary: Delete a repository Actions variable
      parameters:
        - name: repo
          in: path
          required: true
          schema:
            type: string
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Variable deleted

  /repos/{repo}/secrets/{name}:
    put:
      operationId: setSecret
      summary: Create or update a repository Actions secret
      description: Stores the secret on GitHub. The secret value is never returned by the API.
      parameters:
        - name: repo
          in: path
          required: true
          schema:
            type: string
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecretSetRequest'
      responses:
        '200':
          description: Secret set

    delete:
      operationId: deleteSecret
      summary: Delete a repository Actions secret
      parameters:
        - name: repo
          in: path
          required: true
          schema:
            type: string
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Secret deleted
