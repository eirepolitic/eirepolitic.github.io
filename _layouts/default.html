---
---
<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="{{ page.summary | default: site.description | escape }}" />
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}" />
    <link rel="stylesheet" href="{{ '/assets/css/site.css?v=' | append: site.github.build_revision | relative_url }}" />
    <link rel="stylesheet" href="{{ '/assets/css/search.css?v=' | append: site.github.build_revision | relative_url }}" />
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>
    <header class="site-header" role="banner">
      <div class="site-header-inner">
        <a class="site-brand" href="{{ '/' | relative_url }}" aria-label="Eire Politic home">
          <span class="site-logo"><img src="{{ '/assets/brand/logo.png' | relative_url }}" alt="" /></span>
          <span>
            <strong>{{ site.title }}</strong>
            <small>Technical knowledge base</small>
          </span>
        </a>
        <nav class="primary-nav" aria-label="Primary">
          <a{% if page.url == '/' %} class="active" aria-current="page"{% endif %} href="{{ '/' | relative_url }}">Home</a>
          <a{% if page.url contains '/docs/' or page.collection == 'docs' %} class="active" aria-current="page"{% endif %} href="{{ '/docs/' | relative_url }}">Documentation</a>
          <a{% if page.url == '/search/' %} class="active" aria-current="page"{% endif %} href="{{ '/search/' | relative_url }}">Search</a>
          <a{% if page.url == '/articles/' %} class="active" aria-current="page"{% endif %} href="{{ '/articles/' | relative_url }}">Articles</a>
          <a{% if page.url == '/content/' %} class="active" aria-current="page"{% endif %} href="{{ '/content/' | relative_url }}">Content</a>
        </nav>
      </div>
    </header>
    <main id="content" class="site-main{% if page.wide == true %} site-main-wide{% endif %}" role="main">
      {{ content }}
    </main>
    <footer class="site-footer">
      <div class="site-footer-inner">
        <span>{{ site.title }}</span>
        {% if site.github.repository_url %}<a href="{{ site.github.repository_url }}">View source on GitHub</a>{% endif %}
      </div>
    </footer>
    <script src="{{ '/assets/js/site.js?v=' | append: site.github.build_revision | relative_url }}" defer></script>
  </body>
</html>
